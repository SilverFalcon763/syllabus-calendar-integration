<!doctype html>

<html>
  <head>
    <title>syllabus-calendar-integration</title>
  </head>
  <body>
    <h1>Conversion Preview</h1>
    <p><a href="http://127.0.0.1:5000/authorize">Connect Google Calendar</a></p>
    <p id="status"></p>
    <form>
      <input id="course" placeholder="Course" />
      <input id="title" placeholder="Title" />
      <input type="datetime-local" id="date">
      <button>Add Event +</button>
    </form>

    <h2>Your Exams</h2>
    <ul id="event-list"></ul>

    <h2>Exam Countdown</h2>
    <div id="countdown">Add an exam to see the countdown.</div>

    <script src="script.js"></script>
  </body>
</html>
